[package]
name = "verifact"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["crates/verifact-core", "crates/verifact-cli"]
resolver = "2"

[dependencies]
anyhow = "1"
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
cef = { version = "=156.7.0", default-features = false, features = ["build-util"] }
raw-window-handle = { version = "0.6", features = ["std"] }
objc = "0.2"
cocoa = "0.26"
plist = "1"
verifact-core = { path = "crates/verifact-core" }
serde_json = "1"
gpui-component = { version = "=0.5.1", default-features = false }
gpui-component-assets = "=0.5.1"
url = "2"
rust-embed = { version = "8", features = ["debug-embed"] }
tempfile = "3"

[package.metadata.cef.bundle]
helper_name = "verifact-helper"

[profile.dev]
debug = 0

[lints.rust]
# objc 0.2 selector macros probe this legacy cfg internally.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
