[package]
name = "verifact-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
url = "2"
regex = "1"
roxmltree = "0.21"
globset = "0.4"

[dev-dependencies]
tempfile = "3"
